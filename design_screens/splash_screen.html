<style>
        .splash-gradient {
            background: linear-gradient(135deg, theme('colors.primary-container') 0%, #0a1121 100%);
        }
        .glow-effect {
            box-shadow: 0 0 40px rgba(172, 248, 71, 0.15);
        }
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .fade-in-delayed {
            animation: fadeIn 1s ease-out 0.4s forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        /* Loading dots animation */
        .dot-flashing {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: theme('colors.secondary-container');
            color: theme('colors.secondary-container');
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: "";
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -12px;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: theme('colors.secondary-container');
            color: theme('colors.secondary-container');
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 12px;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: theme('colors.secondary-container');
            color: theme('colors.secondary-container');
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: theme('colors.secondary-container'); }
            50%, 100% { background-color: rgba(172, 248, 71, 0.2); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary-container text-on-primary h-screen w-screen overflow-hidden flex flex-col justify-center items-center relative splash-gradient">
<!-- Subtle background accent -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -right-[10%] w-[70vw] h-[70vw] rounded-full bg-secondary-container/5 blur-[100px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/5 blur-[100px]"></div>
</div>
<!-- Main Content Container -->
<div class="flex flex-col items-center justify-center z-10 w-full max-w-sm px-container-margin">
<!-- Logo / Icon -->
<div class="fade-in-up w-24 h-24 mb-xl rounded-2xl bg-surface/10 border border-surface/20 flex items-center justify-center glow-effect backdrop-blur-sm">
<span class="material-symbols-outlined text-secondary-container" style="font-size: 48px; font-variation-settings: 'wght' 300, 'FILL' 1;">
                bolt
            </span>
</div>
<!-- Brand Name -->
<h1 class="fade-in-up font-headline-lg-mobile text-headline-lg-mobile text-on-primary mb-sm text-center tracking-tight" style="animation-delay: 0.1s;">
            Smart Electricity
        </h1>
<!-- Tagline -->
<p class="fade-in-up font-body-md text-body-md text-on-primary-container text-center max-w-[260px]" style="animation-delay: 0.2s;">
            Know where your electricity money goes.
        </p>
<!-- Loading Indicator (positioned at bottom) -->
<div class="absolute bottom-16 fade-in-delayed flex flex-col items-center">
<div class="dot-flashing"></div>
<span class="mt-md font-label-caps text-label-caps text-on-primary-container uppercase tracking-widest opacity-60">Initializing...</span>
</div>
</div>
<script>
        // Simple simulation of splash screen transition
        setTimeout(() => {
            // In a real app, this would route to the dashboard or login
            console.log("Splash screen completed, transitioning to main app...");
        }, 2500);
    </script>
</body></html>
