<script>
        const container = document.getElementById('slides-container');
        const dots = document.querySelectorAll('.dot');
        const controlsNext = document.getElementById('controls-next');
        const controlsFinal = document.getElementById('controls-final');
        const skipContainer = document.getElementById('skip-container');
        let currentSlide = 0;

        function updateUI() {
            const width = container.clientWidth;
            currentSlide = Math.round(container.scrollLeft / width);

            // Update Dots
            dots.forEach((dot, index) => {
                if (index === currentSlide) {
                    dot.classList.remove('w-2', 'bg-surface-variant');
                    dot.classList.add('w-6', 'bg-primary');
                } else {
                    dot.classList.remove('w-6', 'bg-primary');
                    dot.classList.add('w-2', 'bg-surface-variant');
                }
            });

            // Update Buttons & Skip Visibility
            if (currentSlide === 2) {
                // Show final buttons
                controlsNext.style.opacity = '0';
                controlsNext.style.pointerEvents = 'none';
                
                controlsFinal.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                controlsFinal.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
                
                skipContainer.style.opacity = '0';
                skipContainer.style.pointerEvents = 'none';
            } else {
                // Show Next button
                controlsNext.style.opacity = '1';
                controlsNext.style.pointerEvents = 'auto';
                
                controlsFinal.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                controlsFinal.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                
                skipContainer.style.opacity = '1';
                skipContainer.style.pointerEvents = 'auto';
            }
        }

        function scrollNext() {
            const width = container.clientWidth;
            container.scrollTo({
                left: (currentSlide + 1) * width,
                behavior: 'smooth'
            });
        }

        function scrollToEnd() {
            const width = container.clientWidth;
            container.scrollTo({
                left: 2 * width,
                behavior: 'smooth'
            });
        }

        // Listen for scroll events to update UI dynamically when swiping
        container.addEventListener('scroll', () => {
            // Use requestAnimationFrame for smoother performance during scroll
            window.requestAnimationFrame(updateUI);
        });

        // Handle window resize to recalculate slide widths if necessary
        window.addEventListener('resize', updateUI);
    </script>
