<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Connect your electricity - Smart Electricity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#304f00",
                        "tertiary-container": "#271901",
                        "secondary-fixed": "#acf847",
                        "surface": "#fcf8fa",
                        "inverse-primary": "#bec6e0",
                        "surface-container-high": "#eae7e9",
                        "on-surface-variant": "#45464d",
                        "surface-dim": "#dcd9db",
                        "on-primary-fixed-variant": "#3f465c",
                        "secondary": "#416900",
                        "on-background": "#1b1b1d",
                        "tertiary": "#000000",
                        "on-tertiary-fixed": "#271901",
                        "primary-fixed-dim": "#bec6e0",
                        "tertiary-fixed-dim": "#dec29a",
                        "inverse-on-surface": "#f3f0f2",
                        "tertiary-fixed": "#fcdeb5",
                        "on-tertiary": "#ffffff",
                        "background": "#fcf8fa",
                        "primary": "#000000",
                        "surface-bright": "#fcf8fa",
                        "surface-container-low": "#f6f3f5",
                        "outline-variant": "#c6c6cd",
                        "secondary-container": "#acf847",
                        "outline": "#76777d",
                        "on-tertiary-fixed-variant": "#574425",
                        "surface-variant": "#e4e2e4",
                        "on-secondary-fixed": "#102000",
                        "surface-tint": "#565e74",
                        "on-secondary-container": "#457000",
                        "on-surface": "#1b1b1d",
                        "on-tertiary-container": "#98805d",
                        "on-primary": "#ffffff",
                        "surface-container": "#f0edef",
                        "on-primary-fixed": "#131b2e",
                        "primary-fixed": "#dae2fd",
                        "on-primary-container": "#7c839b",
                        "surface-container-highest": "#e4e2e4",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "inverse-surface": "#303032",
                        "on-secondary": "#ffffff",
                        "primary-container": "#131b2e",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#91db2a",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "xl": "32px",
                        "container-margin": "20px",
                        "md": "16px",
                        "sm": "12px",
                        "xs": "8px",
                        "lg": "24px",
                        "card-gap": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "metric-unit": ["Inter"],
                        "body-md": ["Inter"],
                        "display-metrics": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "metric-unit": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-metrics": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .input-glow:focus-within {
            border-color: #000000;
            box-shadow: 0 0 0 2px rgba(172, 248, 71, 0.5); /* secondary-fixed with opacity */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:max-w-md md:mx-auto md:shadow-lg md:my-8 md:h-[800px] md:rounded-[2rem] overflow-hidden relative">
<!-- Top Navigation (Transactional, no bottom nav) -->
<header class="flex justify-between items-center w-full px-container-margin py-md bg-background sticky top-0 z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex space-x-1 items-center">
<!-- Progress Indicator -->
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-8 h-1 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<div class="w-10"></div> <!-- Balancer -->
</header>
<main class="flex-1 overflow-y-auto px-container-margin pb-[100px] hide-scrollbar">
<!-- Header Section -->
<div class="mt-md mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-sm">Connect your electricity</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Add your electricity meter so we can track your purchases and build your energy history.</p>
</div>
<!-- Form Section -->
<div class="space-y-lg">
<!-- Provider (Fixed) -->
<div>
<label class="block font-metric-unit text-metric-unit text-on-surface-variant mb-xs">Provider</label>
<div class="flex items-center bg-surface-container-low border border-outline-variant rounded-lg p-sm cursor-not-allowed">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center mr-sm">
<span class="material-symbols-outlined text-on-surface-variant">electric_bolt</span>
</div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface font-semibold">YEDC</p>
<p class="font-label-caps text-label-caps text-on-surface-variant">Yola Electricity Distribution</p>
</div>
<span class="material-symbols-outlined text-outline-variant">lock</span>
</div>
</div>
<!-- Meter Type Toggle -->
<div>
<label class="block font-metric-unit text-metric-unit text-on-surface-variant mb-xs">Meter Type</label>
<div class="flex bg-surface-container-highest rounded-lg p-1 relative">
<!-- Active background slider (requires JS for full sliding, simulating CSS here) -->
<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-surface rounded shadow-sm border border-outline-variant transition-transform duration-200 ease-out" id="toggle-slider"></div>
<button class="flex-1 py-xs text-center z-10 font-metric-unit text-metric-unit font-semibold text-primary transition-colors duration-200" onclick="document.getElementById('toggle-slider').style.transform='translateX(0)'; this.classList.add('text-primary'); this.nextElementSibling.classList.remove('text-primary'); this.nextElementSibling.classList.add('text-on-surface-variant');" type="button">
                        Prepaid
                    </button>
<button class="flex-1 py-xs text-center z-10 font-metric-unit text-metric-unit text-on-surface-variant font-semibold transition-colors duration-200" onclick="document.getElementById('toggle-slider').style.transform='translateX(100%)'; this.classList.add('text-primary'); this.previousElementSibling.classList.remove('text-primary'); this.previousElementSibling.classList.add('text-on-surface-variant');" type="button">
                        Postpaid
                    </button>
</div>
</div>
<!-- Meter Number Field -->
<div>
<label class="block font-metric-unit text-metric-unit text-on-surface-variant mb-xs" for="meter-number">Meter Number</label>
<div class="relative input-glow border border-outline-variant rounded-lg bg-surface transition-all duration-200">
<input class="w-full bg-transparent border-none rounded-lg py-sm px-sm font-body-lg text-body-lg text-on-surface placeholder-outline focus:ring-0" id="meter-number" inputmode="numeric" placeholder="e.g. 042 1234 5678" type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-sm">
<span class="material-symbols-outlined text-outline">dialpad</span>
</div>
</div>
<p class="mt-1 font-label-caps text-label-caps text-on-surface-variant">Enter the 11-13 digit number on your meter.</p>
</div>
<!-- Meter Nickname Field -->
<div>
<label class="block font-metric-unit text-metric-unit text-on-surface-variant mb-xs" for="meter-nickname">Meter Nickname (Optional)</label>
<div class="relative input-glow border border-outline-variant rounded-lg bg-surface transition-all duration-200">
<input class="w-full bg-transparent border-none rounded-lg py-sm px-sm font-body-md text-body-md text-on-surface placeholder-outline focus:ring-0" id="meter-nickname" placeholder="e.g. Home, Office" type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-sm">
<span class="material-symbols-outlined text-outline">edit</span>
</div>
</div>
</div>
</div>
</main>
<!-- Sticky Bottom CTA -->
<div class="absolute bottom-0 left-0 right-0 p-container-margin bg-gradient-to-t from-background via-background to-transparent pt-xl md:rounded-b-[2rem]">
<button class="w-full h-[52px] bg-primary text-on-primary rounded-full font-headline-md text-headline-md flex items-center justify-center space-x-2 active:scale-95 transition-transform shadow-[0_4px_20px_rgba(15,23,42,0.05)]">
<span>Verify Meter</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</body></html>
